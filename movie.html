<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>영화 티어리스트</title>
  <style>
    body { font-family: sans-serif; background: #222; color: #fff; }
    h1 { text-align: center; }

    /* 티어 한 줄 */
    .tier {
      display: flex;            /* 등급표시 + 영화들을 가로로 */
      align-items: center;
      min-height: 90px;
      margin: 5px;
      border: 1px solid #555;
    }
    /* 등급 이름(S,A,B,C,D) */
    .tier-label {
      width: 60px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #000;
    }
    /* 영화가 놓이는 영역 */
    .tier-zone {
      flex: 1;                  /* 남는 공간 모두 차지 */
      display: flex;
      flex-wrap: wrap;          /* 많아지면 다음 줄로 */
      min-height: 80px;
      padding: 5px;
    }

    /* 등급별 색깔 */
    .s { background: #ff7f7f; }
    .a { background: #ffbf7f; }
    .b { background: #ffff7f; }
    .c { background: #7fff7f; }
    .d { background: #7fbfff; }

    /* 영화 박스(임시) */
    .movie {
      width: 70px; height: 70px;
      margin: 3px;
      background: #666;
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: grab;
    }

    /* 아직 배치 안 된 영화들 보관함 */
    #pool {
      display: flex;
      flex-wrap: wrap;
      min-height: 90px;
      margin: 20px 5px;
      padding: 5px;
      border: 2px dashed #777;
    }
  </style>
</head>
<body>
  <h1>🎬 영화 티어리스트</h1>

  <!-- 5개 티어 영역 -->
  <div class="tier">
    <div class="tier-label s">S</div>
    <div class="tier-zone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
  </div>
  <div class="tier">
    <div class="tier-label a">A</div>
    <div class="tier-zone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
  </div>
  <div class="tier">
    <div class="tier-label b">B</div>
    <div class="tier-zone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
  </div>
  <div class="tier">
    <div class="tier-label c">C</div>
    <div class="tier-zone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
  </div>
  <div class="tier">
    <div class="tier-label d">D</div>
    <div class="tier-zone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
  </div>

  <!-- 아직 배치 안 된 영화 8개 -->
  <div id="pool" ondragover="allowDrop(event)" ondrop="drop(event)">
    <div class="movie" draggable="true" ondragstart="drag(event)" id="m1">영화1</div>
    <div class="movie" draggable="true" ondragstart="drag(event)" id="m2">영화2</div>
    <div class="movie" draggable="true" ondragstart="drag(event)" id="m3">영화3</div>
    <div class="movie" draggable="true" ondragstart="drag(event)" id="m4">영화4</div>
    <div class="movie" draggable="true" ondragstart="drag(event)" id="m5">영화5</div>
    <div class="movie" draggable="true" ondragstart="drag(event)" id="m6">영화6</div>
    <div class="movie" draggable="true" ondragstart="drag(event)" id="m7">영화7</div>
    <div class="movie" draggable="true" ondragstart="drag(event)" id="m8">영화8</div>
  </div>

  <script>
    // 드래그 시작: 어떤 영화를 잡았는지 기억
    function drag(event) {
      event.dataTransfer.setData("text", event.target.id);
    }
    // 놓을 수 있게 허용(이게 없으면 drop이 안 됨)
    function allowDrop(event) {
      event.preventDefault();               
    }
    // 놓기: 기억해둔 영화를 이 영역으로 이동
    function drop(event) {
      event.preventDefault();
      const id = event.dataTransfer.getData("text");
      const movie = document.getElementById(id);
      event.currentTarget.appendChild(movie);
    }
  </script>
</body>
</html>
