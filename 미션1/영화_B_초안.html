<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 영화 티어리스트</title>
<style>
  :root {
    --bg: #121317;
    --panel: #1c1e25;
    --text: #eceef3;
    --muted: #8b90a0;
    --S: #ff5d5d;
    --A: #ff9f43;
    --B: #f6d84a;
    --C: #5fd38d;
    --D: #4aa3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 32px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type="text"] {
    width: 280px; padding: 10px 14px; font-size: 16px;
    background: var(--panel); color: var(--text);
    border: 1px solid #333744; border-radius: 8px; outline: none;
  }
  input[type="text"]:focus { border-color: #6c7aff; }
  button {
    padding: 10px 18px; font-size: 15px; cursor: pointer;
    border: none; border-radius: 8px; color: #fff; background: #4b5cf0;
    font-family: inherit;
  }
  button:hover { filter: brightness(1.15); }
  button.reset { background: #3a3d4a; }
  #msg { min-height: 22px; margin: -8px 0 14px; color: #ff7b7b; font-size: 14px; text-align: right; }

  .tier { display: flex; margin-bottom: 8px; background: var(--panel); border-radius: 10px; overflow: hidden; min-height: 76px; }
  .label {
    width: 84px; flex: 0 0 84px; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; color: #14151a;
  }
  .zone {
    flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px;
    padding: 10px; min-height: 76px; transition: background .15s;
  }
  .zone.over { background: rgba(255,255,255,0.08); }

  .tier[data-tier="S"] .label { background: var(--S); }
  .tier[data-tier="A"] .label { background: var(--A); }
  .tier[data-tier="B"] .label { background: var(--B); }
  .tier[data-tier="C"] .label { background: var(--C); }
  .tier[data-tier="D"] .label { background: var(--D); }

  .pool-title { margin: 24px 0 8px; font-size: 16px; color: var(--muted); }
  .pool { background: var(--panel); border-radius: 10px; border: 1px dashed #3a3d4a; }
  .pool .zone { min-height: 90px; }

  .card {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px 9px 14px; background: #2b2e3a; color: var(--text);
    border-radius: 8px; font-size: 15px; cursor: grab; user-select: none;
    border: 1px solid #3b3f4f;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .card .del {
    all: unset; cursor: pointer; color: var(--muted); font-size: 17px; line-height: 1;
    width: 20px; height: 20px; text-align: center; border-radius: 50%;
  }
  .card .del:hover { background: #ff5d5d; color: #fff; }
  .empty-hint { color: #5a5f70; font-size: 14px; padding: 8px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 내 영화 티어리스트</h1>
    <div class="controls">
      <input type="text" id="titleInput" placeholder="영화 제목을 입력하세요" maxlength="60">
      <button id="addBtn">추가</button>
      <button id="resetBtn" class="reset">처음으로</button>
    </div>
  </header>
  <div id="msg"></div>

  <div id="tiers"></div>

  <div class="pool-title">미분류</div>
  <div class="pool tier" data-tier="U" style="display:block;">
    <div class="zone" data-zone="U"></div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = "movieTierList.v1";
  var TIERS = ["S", "A", "B", "C", "D"];
  var INITIAL = [
    "기생충", "인터스텔라", "라라랜드", "센과 치히로의 행방불명",
    "어벤져스: 엔드게임", "범죄도시", "타이타닉", "토이 스토리"
  ];

  var movies = [];
  var dragId = null;
  var seq = 0;

  function newId() { seq += 1; return "m" + Date.now().toString(36) + seq; }

  function initialMovies() {
    return INITIAL.map(function (t, i) { return { id: "init" + i, title: t, tier: "U" }; });
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(movies)); } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        if (Array.isArray(data)) return data;
      }
    } catch (e) {}
    return null;
  }

  var tiersEl = document.getElementById("tiers");
  var msgEl = document.getElementById("msg");
  var inputEl = document.getElementById("titleInput");

  function buildSkeleton() {
    TIERS.forEach(function (t) {
      var row = document.createElement("div");
      row.className = "tier";
      row.setAttribute("data-tier", t);
      row.innerHTML = '<div class="label">' + t + '</div><div class="zone" data-zone="' + t + '"></div>';
      tiersEl.appendChild(row);
    });
    var zones = document.querySelectorAll(".zone");
    Array.prototype.forEach.call(zones, function (z) {
      z.addEventListener("dragover", function (e) { e.preventDefault(); z.classList.add("over"); });
      z.addEventListener("dragleave", function () { z.classList.remove("over"); });
      z.addEventListener("drop", function (e) {
        e.preventDefault();
        z.classList.remove("over");
        var id = dragId || e.dataTransfer.getData("text/plain");
        var m = movies.filter(function (x) { return x.id === id; })[0];
        if (!m) return;
        m.tier = z.getAttribute("data-zone");
        save();
        render();
      });
    });
  }

  function makeCard(m) {
    var card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    var span = document.createElement("span");
    span.textContent = m.title;
    var del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "×";
    del.title = "삭제";
    del.addEventListener("click", function () {
      movies = movies.filter(function (x) { return x.id !== m.id; });
      save();
      render();
    });
    card.appendChild(span);
    card.appendChild(del);
    card.addEventListener("dragstart", function (e) {
      dragId = m.id;
      e.dataTransfer.setData("text/plain", m.id);
      e.dataTransfer.effectAllowed = "move";
      setTimeout(function () { card.classList.add("dragging"); }, 0);
    });
    card.addEventListener("dragend", function () {
      dragId = null;
      card.classList.remove("dragging");
    });
    return card;
  }

  function render() {
    var zones = document.querySelectorAll(".zone");
    Array.prototype.forEach.call(zones, function (z) {
      z.innerHTML = "";
      var key = z.getAttribute("data-zone");
      movies.filter(function (m) { return m.tier === key; }).forEach(function (m) {
        z.appendChild(makeCard(m));
      });
      if (!z.firstChild && key === "U") {
        var h = document.createElement("div");
        h.className = "empty-hint";
        h.textContent = "미분류 영화가 없습니다.";
        z.appendChild(h);
      }
    });
  }

  function showMsg(t) { msgEl.textContent = t; }

  function addMovie() {
    var title = inputEl.value.trim();
    if (!title) {
      showMsg("영화 제목을 입력해 주세요.");
      inputEl.focus();
      return;
    }
    showMsg("");
    movies.push({ id: newId(), title: title, tier: "U" });
    inputEl.value = "";
    save();
    render();
    inputEl.focus();
  }

  document.getElementById("addBtn").addEventListener("click", addMovie);
  inputEl.addEventListener("keydown", function (e) { if (e.key === "Enter") addMovie(); });
  inputEl.addEventListener("input", function () { showMsg(""); });

  document.getElementById("resetBtn").addEventListener("click", function () {
    movies = initialMovies();
    showMsg("");
    save();
    render();
  });

  buildSkeleton();
  movies = load() || initialMovies();
  render();
})();
</script>
</body>
</html>
